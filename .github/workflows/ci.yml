name: ci
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['25', '26', '27']
        architecture: [ 'x64' ]
      fail-fast: false
    name: Build with JDK ${{ matrix.java }} on ${{ matrix.architecture }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'corretto'
          java-version: ${{ matrix.java }}
          architecture: ${{ matrix.architecture }}
          cache: 'maven'

      - name: Build with Maven
        run: ./mvnw -B package

      - name: Verify jar
        uses: pivovarit/verify-jar-action@v1.4.0
        with:
          directory: 'zazr-core/target'
          java-version: '25'

  javadoc:
    runs-on: ubuntu-latest
    name: Javadoc (doclint)
    steps:
      - uses: actions/checkout@v7
      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'corretto'
          java-version: '25'
          cache: 'maven'
      - name: Build the javadoc
        run: make javadoc

  vocabulary:
    runs-on: ubuntu-latest
    name: No category-theory vocabulary
    steps:
      - uses: actions/checkout@v7
      - name: Grep for the forbidden words
        run: make vocabulary

  complexity:
    runs-on: ubuntu-latest
    name: Complexity note on every positional method
    steps:
      - uses: actions/checkout@v7
      - name: Setup scala-cli
        uses: VirtusLab/scala-cli-setup@v1
      # after scala-cli-setup, so that JAVA_HOME is this JDK: the script parses Java 25 sources with the system javac
      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'corretto'
          java-version: '25'
      - name: Check the javadoc of the positional methods
        run: make complexity

  docs:
    runs-on: ubuntu-latest
    name: Complexity page up to date, every site example tested
    steps:
      - uses: actions/checkout@v7
      - name: Setup scala-cli
        uses: VirtusLab/scala-cli-setup@v1
      # after scala-cli-setup, so that JAVA_HOME is this JDK: the scripts parse Java 25 sources with the system javac
      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'corretto'
          java-version: '25'
      - name: Regenerate the complexity page and compare
        run: make docs-complexity-check
      - name: Check that every java block of the site is in a docs example test
        run: make docs-examples

  coverage:
    runs-on: ubuntu-latest
    name: Test coverage (JaCoCo)
    # contents: read for the checkout; pull-requests: write for the coverage comment on the pull request
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - name: Setup scala-cli
        uses: VirtusLab/scala-cli-setup@v1
      # after scala-cli-setup, so that JAVA_HOME is this JDK
      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'corretto'
          java-version: '25'
          cache: 'maven'
      - name: Run the tests with the JaCoCo agent and check the threshold
        run: make coverage
      # also when the threshold check fails, to show which figure is below it
      - name: Coverage summary
        if: success() || failure()
        run: |
          make -s coverage-summary > coverage-summary.md
          cat coverage-summary.md >> "$GITHUB_STEP_SUMMARY"
      # One comment per pull request, found by its marker and edited in place on every push. With gh, which the runner
      # already has, rather than a third-party action. Skipped for a pull request from a fork or from Dependabot, whose
      # token cannot write. When make coverage failed before the report existed, the summary is empty and the
      # previous comment is left as it is.
      - name: Coverage comment on the pull request
        if: >-
          (success() || failure())
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && github.actor != 'dependabot[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ ! -s coverage-summary.md ]; then
            echo "no coverage summary: the comment is left unchanged"
            exit 0
          fi
          marker='<!-- zazr-coverage -->'
          body="$(printf '%s\n' "$marker"; cat coverage-summary.md; printf '\n_Commit %s._\n' "$SHA")"
          id="$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n 1)"
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="$body" > /dev/null
          fi
      - name: Upload the HTML report
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: zazr-test/target/site/jacoco-aggregate
          if-no-files-found: error

  nullness:
    runs-on: ubuntu-latest
    name: Verify JSpecify nullness contract
    steps:
      - uses: actions/checkout@v7
      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'corretto'
          java-version: '25'
          cache: 'maven'

      - name: Run NullAway
        run: ./mvnw -B -Pnullaway compile

  deploy-snapshot:
    runs-on: ubuntu-latest
    needs: [build, nullness, javadoc, vocabulary, complexity, docs]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v7
      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'corretto'
          java-version: '25'
          cache: 'maven'
          server-id: central
          server-username-env-var: SONATYPE_USERNAME
          server-password-env-var: SONATYPE_PASSWORD

      # PGP_SECRET holds the armored private key, base64-encoded as sbt-ci-release stores it;
      # a plain armored key works too.
      - name: Import PGP key
        run: (printf '%s' "$PGP_SECRET" | base64 -d 2>/dev/null || printf '%s' "$PGP_SECRET") | gpg --batch --import
        env:
          PGP_SECRET: ${{ secrets.PGP_SECRET }}

      - name: Read project version
        id: version
        run: |
          VERSION="$(./mvnw -q -DforceStdout help:evaluate -Dexpression=project.version)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Deploy Snapshot
        if: endsWith(steps.version.outputs.version, '-SNAPSHOT')
        run: ./mvnw -B --no-transfer-progress -Pmaven-central-release -DskipTests=true deploy
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
