name: ci
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['25', '26', '27']
        architecture: [ 'x64' ]
      fail-fast: false
    name: Build with JDK ${{ matrix.java }} on ${{ matrix.architecture }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'corretto'
          java-version: ${{ matrix.java }}
          architecture: ${{ matrix.architecture }}
          cache: 'maven'

      - name: Build with Maven
        run: ./mvnw -B package

      - name: Verify jar
        uses: pivovarit/verify-jar-action@v1.4.0
        with:
          directory: 'zazr-core/target'
          java-version: '25'

  javadoc:
    runs-on: ubuntu-latest
    name: Javadoc (doclint)
    steps:
      - uses: actions/checkout@v7
      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'corretto'
          java-version: '25'
          cache: 'maven'
      - name: Build the javadoc
        run: make javadoc

  vocabulary:
    runs-on: ubuntu-latest
    name: No category-theory vocabulary
    steps:
      - uses: actions/checkout@v7
      - name: Grep for the forbidden words
        run: make vocabulary

  complexity:
    runs-on: ubuntu-latest
    name: Complexity note on every positional method
    steps:
      - uses: actions/checkout@v7
      - name: Setup scala-cli
        uses: VirtusLab/scala-cli-setup@v1
      # after scala-cli-setup, so that JAVA_HOME is this JDK: the script parses Java 25 sources with the system javac
      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'corretto'
          java-version: '25'
      - name: Check the javadoc of the positional methods
        run: make complexity

  docs:
    runs-on: ubuntu-latest
    name: Complexity page up to date, every site example tested and aligned
    steps:
      - uses: actions/checkout@v7
      - name: Setup scala-cli
        uses: VirtusLab/scala-cli-setup@v1
      # after scala-cli-setup, so that JAVA_HOME is this JDK: the scripts parse Java 25 sources with the system javac
      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'corretto'
          java-version: '25'
      - name: Regenerate the complexity page and compare
        run: make docs-complexity-check
      - name: Check that every java block of the site is in a docs example test
        run: make docs-examples
      - name: Check that the declarations of every java block of the site are aligned
        run: make docs-align-check

  coverage:
    runs-on: ubuntu-latest
    name: Test coverage (JaCoCo)
    steps:
      - uses: actions/checkout@v7
      - name: Setup scala-cli
        uses: VirtusLab/scala-cli-setup@v1
      # after scala-cli-setup, so that JAVA_HOME is this JDK
      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'corretto'
          java-version: '25'
          cache: 'maven'
      - name: Run the tests with the JaCoCo agent
        run: make coverage
      - name: Coverage summary
        run: make -s coverage-summary >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the HTML report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: zazr-test/target/site/jacoco-aggregate
          if-no-files-found: error

  nullness:
    runs-on: ubuntu-latest
    name: Verify JSpecify nullness contract
    steps:
      - uses: actions/checkout@v7
      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'corretto'
          java-version: '25'
          cache: 'maven'

      - name: Run NullAway
        run: ./mvnw -B -Pnullaway compile

  deploy-snapshot:
    runs-on: ubuntu-latest
    needs: [build, nullness, javadoc, vocabulary, complexity, docs]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v7
      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'corretto'
          java-version: '25'
          cache: 'maven'
          server-id: central
          server-username-env-var: SONATYPE_USERNAME
          server-password-env-var: SONATYPE_PASSWORD

      # PGP_SECRET holds the armored private key, base64-encoded as sbt-ci-release stores it;
      # a plain armored key works too.
      - name: Import PGP key
        run: (printf '%s' "$PGP_SECRET" | base64 -d 2>/dev/null || printf '%s' "$PGP_SECRET") | gpg --batch --import
        env:
          PGP_SECRET: ${{ secrets.PGP_SECRET }}

      - name: Read project version
        id: version
        run: |
          VERSION="$(./mvnw -q -DforceStdout help:evaluate -Dexpression=project.version)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Deploy Snapshot
        if: endsWith(steps.version.outputs.version, '-SNAPSHOT')
        run: ./mvnw -B --no-transfer-progress -Pmaven-central-release -DskipTests=true deploy
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
