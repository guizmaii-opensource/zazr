# the decision log is for contributors: it stays in the repository and is not published
exclude_docs: |
  design.md

site_name: Zazr
site_url: https://zazr.dev/
site_description: >-
  Modern Functional Programming for Java 25+. Inspired by modern Scala, ZIO, and zio-prelude.
repo_url: https://github.com/guizmaii-opensource/zazr
repo_name: guizmaii-opensource/zazr
edit_uri: edit/main/docs/
copyright: >-
  Made by <a href="https://github.com/guizmaii" target="_blank" rel="noopener">Jules Ivanic</a>.
  Zazr is released under the Apache License 2.0. It is a fork of
  <a href="https://github.com/vavr-io/vavr">Vavr</a>, copyright its authors, under the same license;
  see <a href="https://github.com/guizmaii-opensource/zazr/blob/main/NOTICE">NOTICE</a>.

docs_dir: docs
strict: true

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/zaz-256.png
  favicon: assets/favicon.ico
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to the dark palette
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to the light palette
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - toc.follow

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/guizmaii-opensource/zazr

extra_css:
  - assets/zazr.css

plugins:
  - search
  # the pages that moved keep their old address
  - redirects:
      redirect_maps:
        control-types.md: control/index.md
        validation.md: control/validation.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [docs/collections/.costs]
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: relative_to_docs
    unrecognized_links: warn

nav:
  - Home: index.md
  - Guide:
      - "New to functional programming?": new-to-fp.md
      - Getting started: getting-started.md
      - zip at arity N: zip.md
      - NonEmptyVector: non-empty-vector.md
      - NonEmptySet and NonEmptyMap: non-empty-set-map.md
      - Builders: builders.md
      - Java interop: java-interop.md
  - Control types:
      - Overview: control/index.md
      - Option: control/option.md
      - Either: control/either.md
      - Try: control/try.md
      - Using: control/using.md
      - Validation: control/validation.md
      - Lazy: control/lazy.md
  - Collections:
      - Overview: collections/index.md
      - Vector: collections/vector.md
      - List: collections/list.md
      - Queue: collections/queue.md
      - Stream: collections/stream.md
      - Sets: collections/sets.md
      - Maps: collections/maps.md
      - Complexity: collections/complexity.md
  - Testing: testing.md
  - Compared to Vavr: vavr.md
  - Design: principles.md
